<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw</title><link rel="stylesheet" href="/style.css"></head><body><header><b>GameEarn</b><nav><a href="/dashboard.html">Dashboard</a><a href="/offers.html">Earn</a></nav></header><main><small>REDEEM</small><h1>Request a withdrawal</h1><form class="card narrow" id="f"><p>Minimum withdrawal: <b>$1.00</b></p><input id="amount" type="number" min="1" step=".01" placeholder="Amount in USD" required><select id="method"><option value="paypal">PayPal</option><option value="upi">UPI</option><option value="gift_card">Gift card</option><option value="game_reward">Game reward request</option></select><textarea id="details" placeholder="Payment/reward details" required></textarea><button>Submit request</button><p id="msg"></p></form></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/withdraw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount_cents:Math.round(+amount.value*100),method:method.value,details:details.value})}),j=await r.json();msg.textContent=r.ok?"Request submitted — PENDING":j.error}</script></body></html>
