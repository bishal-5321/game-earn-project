<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earn</title><link rel="stylesheet" href="/style.css"></head><body><header><b>GameEarn</b><nav><a href="/dashboard.html">Dashboard</a><a href="/withdraw.html">Withdraw</a></nav></header><main><small>CHOOSE YOUR METHOD</small><h1>Earn rewards</h1><p>Demo offers for testing. Real offers should be verified by an offerwall callback.</p><div id="list"></div></main><script>async function load(){let r=await fetch("/api/offers");if(!r.ok)return location="/";let a=(await r.json()).offers;list.innerHTML=a.map(o=>`<article class="offer card"><div><small>${o.category}</small><h2>${o.title}</h2></div><div><strong>+$${(o.reward_cents/100).toFixed(2)}</strong><button onclick="done('${o.id}')">Demo complete</button></div></article>`).join("")}async function done(id){let r=await fetch("/api/offers/"+id+"/complete",{method:"POST"}),j=await r.json();alert(r.ok?"Reward credited!":j.error);if(r.ok)load()}load()</script></body></html>
