<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameEarn</title><link rel="stylesheet" href="/style.css"></head><body><header><b>GameEarn</b><nav><a href="#register">Register</a><a href="#login">Login</a></nav></header><main><section class="hero"><small>EARN • PLAY • REDEEM</small><h1>Earn rewards by completing games, offers and tasks.</h1><p>Complete offers, build your balance and request eligible rewards from $1.</p></section><section class="auth"><form class="card" id="register"><h2>Create account</h2><input name="username" placeholder="Username" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Create account</button><p id="rm"></p></form><form class="card" id="login"><h2>Log in</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Log in</button><p id="lm"></p></form></section></main><script>async function post(u,d){let r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw Error(j.error);return j}register.onsubmit=async e=>{e.preventDefault();try{await post("/api/register",Object.fromEntries(new FormData(e.target)));location="/dashboard.html"}catch(x){rm.textContent=x.message}};login.onsubmit=async e=>{e.preventDefault();try{await post("/api/login",Object.fromEntries(new FormData(e.target)));location="/dashboard.html"}catch(x){lm.textContent=x.message}}</script></body></html>
