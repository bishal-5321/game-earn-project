<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><header><b>GameEarn</b><nav><a href="/offers.html">Earn</a><a href="/withdraw.html">Withdraw</a><button id="out">Log out</button></nav></header><main><section class="head"><div><small>DASHBOARD</small><h1>Welcome, <span id="name">...</span></h1></div><div class="balance">$<span id="bal">0.00</span></div></section><section class="cards"><a class="card" href="/offers.html"><b>Earn</b><p>Complete offers and tasks</p></a><a class="card" href="/withdraw.html"><b>Withdraw</b><p>Minimum $1.00</p></a><div class="card"><b>Referral code</b><p id="ref">...</p></div></section><section class="card"><h2>Recent activity</h2><div id="tx">Loading...</div></section></main><script>async function load(){let r=await fetch("/api/me");if(!r.ok)return location="/";let u=(await r.json()).user;name.textContent=u.username;bal.textContent=(u.balance_cents/100).toFixed(2);ref.textContent=u.referral_code;let t=(await (await fetch("/api/transactions")).json()).transactions;tx.innerHTML=t.length?t.map(x=>`<p>${x.description} <b>${x.amount_cents>=0?"+":"-"}$${Math.abs(x.amount_cents/100).toFixed(2)}</b></p>`).join(""):"No activity yet."}out.onclick=async()=>{await fetch("/api/logout",{method:"POST"});location="/"};load()</script></body></html>
